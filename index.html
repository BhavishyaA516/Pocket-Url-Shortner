<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="top">
    <header>
        <div class="logo">Pocket URL Shortener</div>
        <p class="tagline">Make your links powerful. Shorten smartly.</p>
    </header>

    <main>
        <div class="container glass">
            <h2>Paste your long URL below</h2>
            <input type="url" id="urlInput" placeholder="https://example.com/your-long-link">
            <button id="shortenBtn">🚀 Shorten URL</button>

            <div id="spinner" class="hidden">⏳ Shortening...</div>

            <div id="result" class="hidden">
                <p>Here’s your Short URL:</p>
                <a href="#" id="shortUrl" target="_blank"></a>
                <button id="copyBtn">📋 Copy Link</button>
            </div>

            <p id="message" class="hidden"></p>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="social-links">
                <a href="mailto:bhavishyaambati1@gmail.com" target="_blank">📧 Email</a>
                <a href="https://linkedin.com/in/bhavishya-ambati" target="_blank">💼 LinkedIn</a>
                <a href="https://github.com/BhavishyaA516/" target="_blank">🐱 GitHub</a>
            </div>
            <p>© 2025 Pocket URL Shortener. All rights reserved.</p>
            <a href="#top" class="back-to-top">↑ Back to top</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
